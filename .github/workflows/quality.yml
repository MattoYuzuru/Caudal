name: Quality and delivery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
      - name: Format and lint
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./cmd/... ./internal/...
          shellcheck scripts/*.sh ops/*.sh
      - name: Unit and HTTP / MCP integration
        run: |
          go test -race -coverprofile=coverage.out ./cmd/... ./internal/...
          go tool cover -func=coverage.out | awk '/^total:/ { print; if ($3+0 >= 70) pass=1 } END { exit !pass }'
      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./cmd/... ./internal/...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caudal-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: caudal-web
          path: web/dist
      - name: Package Linux server and collectors
        run: scripts/package.sh "$GITHUB_SHA" build
      - name: Rehearse release with a stock Linux collector
        run: |
          tar -xzf "build/caudal-$GITHUB_SHA-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          python3 scripts/smoke-release.py "$RUNNER_TEMP/caudal-$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caudal-linux-amd64-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14
